[project]
name = "ruff-demo"
version = "0.1.0"
description = "Simple Ruff demo for class"
readme = "README.md"
authors = [
    { name = "Gabriel da Silva", email = "gabriel.silvamf@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
